name: CI — Pull Request Checks

on:
  pull_request:
    branches: [main]

# Least privilege: jobs only read the repo. The SAST job overrides this with the
# extra scopes it needs (security-events: write) in its own permissions block.
permissions:
  contents: read

# Cancel in-progress CI runs for the same PR branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Unit tests ──────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: placeholder-key
      MINIO_SECRET_KEY: placeholder-secret-key-min
      MINIO_BUCKET: snackspot
      MINIO_PUBLIC_URL: https://snackspot.online
      JWT_ACCESS_SECRET: placeholder-access-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: placeholder-refresh-secret-at-least-32-chars-long
      RESEND_API_KEY: re_placeholder_key
      RESEND_FROM_EMAIL: SnackSpot <noreply@snackspot.online>
      NEXT_PUBLIC_APP_URL: https://snackspot.online
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Configure pnpm for CI
        # Replace shamefully-hoist with node-linker=hoisted.
        # This gives each workspace package its own flat REAL node_modules
        # (no symlinks). prisma lands in packages/db/node_modules/,
        # tailwindcss lands in apps/web/node_modules/.
        run: sed -i 's/shamefully-hoist=true/node-linker=hoisted/' .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts --prod=false

      - name: Generate Prisma client
        # Resolve Prisma via pnpm workspace scripts so CI is independent of node_modules layout.
        run: pnpm --filter @snackspot/db generate

      - name: Run unit tests
        run: pnpm --filter web test

  # ─── Job 2: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Configure pnpm for CI
        run: sed -i 's/shamefully-hoist=true/node-linker=hoisted/' .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts --prod=false

      # Warnings are treated as errors so they cannot accumulate unnoticed.
      - name: Lint web app
        run: pnpm --filter web exec next lint --max-warnings 0

      - name: Lint admin app
        run: pnpm --filter @snackspot/admin exec next lint --max-warnings 0

  # ─── Job 3: Type check ───────────────────────────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Configure pnpm for CI
        run: sed -i 's/shamefully-hoist=true/node-linker=hoisted/' .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts --prod=false

      # tsc needs the generated Prisma client for @prisma/client types.
      - name: Generate Prisma client
        run: pnpm --filter @snackspot/db generate

      - name: Type check web app
        run: pnpm --filter web exec tsc --noEmit

      - name: Type check admin app
        run: pnpm --filter @snackspot/admin exec tsc --noEmit

      - name: Type check worker
        run: pnpm --filter worker exec tsc --noEmit

  # ─── Job 4: Build verification ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: placeholder-key
      MINIO_SECRET_KEY: placeholder-secret-key-min
      MINIO_BUCKET: snackspot
      MINIO_PUBLIC_URL: https://snackspot.online
      JWT_ACCESS_SECRET: placeholder-access-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: placeholder-refresh-secret-at-least-32-chars-long
      RESEND_API_KEY: re_placeholder_key
      RESEND_FROM_EMAIL: SnackSpot <noreply@snackspot.online>
      NEXT_PUBLIC_APP_URL: https://snackspot.online
      NEXT_PUBLIC_MINIO_PUBLIC_URL: https://snackspot.online
      NEXT_PUBLIC_MINIO_BUCKET: snackspot
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Configure pnpm for CI
        run: sed -i 's/shamefully-hoist=true/node-linker=hoisted/' .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts --prod=false

      - name: Debug — package locations after install
        run: |
          echo "=== .npmrc ==="
          cat .npmrc
          echo ""
          echo "=== tailwindcss locations ==="
          find . -name "package.json" -path "*/tailwindcss/package.json" ! -path "*/.git/*" 2>/dev/null | head -10 || echo "not found"
          echo ""
          echo "=== prisma locations ==="
          find . -path "*/prisma/build/index.js" ! -path "*/.git/*" 2>/dev/null | head -5 || echo "not found"
          echo ""
          echo "=== require.resolve test from apps/web ==="
          node -e "
            const path = require('path');
            const dir = path.resolve('apps/web');
            ['tailwindcss','postcss','autoprefixer'].forEach(pkg => {
              try { console.log(pkg + ': FOUND at ' + require.resolve(pkg, { paths: [dir] })); }
              catch(e) { console.log(pkg + ': MISSING'); }
            });
          "

      - name: Generate Prisma client
        run: pnpm --filter @snackspot/db generate

      - name: Build web app
        run: pnpm --filter web build

      - name: Build worker
        run: pnpm --filter worker build

      - name: Build admin app
        run: pnpm --filter @snackspot/admin build

  # ─── Job 5: SAST (Semgrep) ───────────────────────────────────────────────────
  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Semgrep
        run: pip install semgrep

      # Semgrep resolves rules from the registry at scan time, so new rules can start
      # failing CI without anything in this repo changing. The package-manager rules below
      # arrived that way in Aug 2026 and require tooling this repo does not run yet:
      # minimumReleaseAge needs pnpm >=10.16, trustPolicy >=10.21, blockExoticSubdeps
      # >=10.26, and npm's min-release-age needs npm >=11.10 — while package.json pins
      # pnpm@9.15.4. Adding the keys anyway would satisfy the linter while pnpm 9 ignored
      # them, which is worse than an honest exclusion. Drop these once pnpm is on 10.x.
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/typescript
          --config p/nodejs
          --config p/owasp-top-ten
          --config p/jwt
          --config p/nextjs
          --exclude-rule generic.nginx.security.request-host-used.request-host-used
          --exclude-rule generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
          --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
          --exclude-rule package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies
          --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
          --sarif --output semgrep.sarif
          --error

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  # ─── Job 6: Dependency audit ─────────────────────────────────────────────────
  # Reports known vulnerabilities in dependencies (high/critical). Non-blocking:
  # most advisories are transitive and need triage, and Dependabot (.github/
  # dependabot.yml) drives the actual remediation PRs. This step keeps the current
  # advisory state visible in every PR so regressions are noticed.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      # No `cache: 'pnpm'` here: this job runs `pnpm audit` straight off the
      # lockfile and never runs `pnpm install`, so the pnpm store is never
      # created — caching it would fail the post-job step trying to save a
      # non-existent path.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level=high

version: 2
updates:
  # JavaScript/TypeScript dependencies (pnpm workspace — the root lockfile covers all packages).
  # Grouped to reduce PR noise; security updates always open their own PRs regardless of grouping.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # Wait a week before proposing a newly published version. Compromised releases are
    # typically caught and yanked within days, so a cooldown keeps the worst of them from
    # ever reaching a PR. Security advisories bypass this and are still raised immediately.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflows pin actions to commit SHAs; Dependabot updates the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
